<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ranking de Matrículas</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/fullscreen.css">
</head>

<body>

    <main class="page">

        <button
            id="btn-fullscreen"
            class="btn-fullscreen"
            type="button"
            aria-label="Abrir em tela cheia"
            title="Tela cheia"
        >
            <svg class="fullscreen-icon fullscreen-enter" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9V4h5 M15 4h5v5 M20 15v5h-5 M9 20H4v-5"></path>
            </svg>

            <svg class="fullscreen-icon fullscreen-exit" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 4v5H4 M20 9h-5V4 M15 20v-5h5 M4 15h5v5"></path>
            </svg>
        </button>

        <section class="ranking ranking-unidades">
            <table>
                <thead>
                    <tr>
                        <th class="col-posicao">#</th>
                        <th class="col-nome">Unidade</th>
                        <th class="col-novos">Novos</th>
                        <th class="col-rematricula">Remat..</th>
                        <th class="col-total">Total</th>
                        <th class="col-meta">Meta</th>
                        <th class="col-percentual">% Meta</th>
                    </tr>
                </thead>

                <tbody id="tbody-unidades"></tbody>
            </table>
        </section>


        <section class="ranking ranking-campos">
            <table>
                <thead>
                    <tr>
                        <th class="col-posicao">#</th>
                        <th class="col-nome">Campo</th>
                        <th class="col-novos">Novos</th>
                        <th class="col-rematricula">Remat..</th>
                        <th class="col-total">Total</th>
                        <th class="col-meta">Meta</th>
                        <th class="col-percentual">% Meta</th>
                    </tr>
                </thead>

                <tbody id="tbody-campos"></tbody>
            </table>
        </section>


        <div id="data-geracao" class="data-geracao"></div>

    </main>

    <script src="./js/ranking.js"></script>
    <script src="./js/fullscreen.js"></script>

</body>
</html>
